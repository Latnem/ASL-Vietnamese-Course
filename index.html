<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vocabulary Course — EN | VI (Sign + Picture)</title>
<style>
  :root{
    --bg:#ffffff; --card:#fff; --ink:#222; --muted:#6a6a6a; --border:#e8e8ef;
    --shadow:0 8px 24px rgba(0,0,0,.07); --radius:16px;
    --brand:#2563eb; --ring: rgba(37,99,235,.25);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
    background:var(--bg);color:var(--ink)
  }
  .wrap{max-width:1100px;margin:32px auto;padding:0 16px}
  header{
    display:flex;align-items:center;gap:12px;margin-bottom:16px
  }
  .back{
    appearance:none;border:1px solid var(--border);background:#fff;
    border-radius:10px;padding:8px 12px;cursor:pointer
  }
  .back:hover{border-color:var(--brand)}
  .title{font-size:20px;font-weight:700}
  .panel{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow)
  }
  .units{
    display:grid;grid-template-columns:repeat(5,1fr);
    gap:12px;padding:16px
  }
  @media (max-width:900px){.units{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:600px){.units{grid-template-columns:repeat(2,1fr)}}
  .unit-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 12px;border-radius:12px;border:1px solid var(--border);
    background:#fafbff;cursor:pointer;font-weight:600
  }
  .unit-btn:hover{outline:3px solid var(--ring);background:#fff}

  .unit-page{padding:14px 16px 18px}
  .unit-head{
    display:flex;align-items:center;gap:10px;margin:0 0 8px
  }
  .unit-head h2{margin:0;font-size:18px;font-weight:800}

  .search-row{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    margin:0 0 10px
  }
  .search-label{
    font-size:14px;color:var(--muted);min-width:52px
  }
  .search-input{
    flex:1 1 220px;
    padding:8px 10px;border-radius:10px;border:1px solid var(--border);
    font-size:14px
  }
  .search-input:focus{
    outline:2px solid var(--ring);border-color:var(--brand)
  }

  .entry{
    border:1px solid var(--border);border-radius:12px;
    background:#fff;overflow:clip;margin-top:12px
  }
  .entry-top{
    padding:12px 14px;
    border-bottom:1px dashed var(--border);
    display:flex;
    gap:8px;
    align-items:center;
    white-space:nowrap;  /* keep “family — gia đình” on one line */
  }
  .en{font-weight:800}
  .sep{opacity:.5}
  .vi{color:#333}

  .media{
    display:grid;grid-template-columns:1fr 1fr;
    gap:14px;padding:14px
  }
  .media .box{
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:transparent; /* no black background */
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:180px;
  }
  video{
    width:100%;
    height:100%;
    max-height:320px;
    background:#000;
    display:block;
  }
  iframe{
    width:100%;
    height:100%;
    display:block;
  }
  /* Pictures: same height, no stretch/crop, full image visible */
  img{
    height:260px;       /* fixed height */
    width:auto;         /* keep aspect ratio */
    max-width:100%;     /* don't overflow column */
    object-fit:contain; /* no cropping */
    display:block;
    background:transparent;
  }

  .speed-row{
    padding:0 14px 14px;
    display:flex;flex-wrap:wrap;gap:8px;align-items:center
  }
  .speed-label{
    font-size:13px;color:var(--muted)
  }
  .speed-btn{
    appearance:none;
    border:1px solid var(--border);
    background:#fff;
    border-radius:999px;
    padding:3px 10px;
    font-size:13px;
    cursor:pointer;
  }
  .speed-btn.active{
    border-color:var(--brand);
    background:rgba(37,99,235,.06);
    font-weight:600;
  }
  .hidden{display:none}

  /* 📱 Mobile tweaks */
  @media (max-width:700px){
    .wrap{
      margin:20px auto;
      padding:0 10px;
    }
    header{
      flex-wrap:wrap;
      align-items:flex-start;
    }
    .title{
      font-size:18px;
    }
    /* keep entry-top inline even on mobile – no override here */
    .media{
      grid-template-columns:1fr; /* stack video over picture */
    }
    .media .box{
      min-height:200px; /* a bit more room when stacked */
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header id="header">
    <button class="back hidden" id="backBtn">🔙 Back to Units</button>
    <div class="title" id="headerTitle">ASL | VIETNAMESE</div>
  </header>

  <!-- Units view (default) -->
  <section class="panel" id="unitsView" aria-label="Units">
    <div class="units">
      <button class="unit-btn" data-unit="Family">👨‍👩‍👧 Family</button>

      <button class="unit-btn" data-unit="Chores">🧹 Chores</button>
    </div>
  </section>

  <!-- Unit page -->
  <section class="panel hidden" id="unitPage" aria-live="polite">
    <div class="unit-page">
      <div class="unit-head">
        <h2 id="unitTitle">Unit</h2>
      </div>

      <!-- Search bar -->
      <div class="search-row">
        <label for="searchInput" class="search-label">Search</label>

          list="vocabSuggestions"/>

      </div>

      <div id="entries"></div>
    </div>
  </section>
</div>

const backBtn   = document.getElementById("backBtn");
const headerTitle = document.getElementById("headerTitle");
const searchInput = document.getElementById("searchInput");
const suggestions = document.getElementById("vocabSuggestions");

document.querySelector(".units").addEventListener("click", e=>{
  const btn = e.target.closest(".unit-btn"); if(!btn) return;
  openUnit(btn.dataset.unit);
});
backBtn.addEventListener("click", ()=>showUnits());

function showUnits(){
  unitPage.classList.add("hidden");
  unitsView.classList.remove("hidden");
  backBtn.classList.add("hidden");
  headerTitle.textContent = "ASL | VIETNAMESE";
  searchInput.value = "";
}

function openUnit(name){
  unitsView.classList.add("hidden");
  unitPage.classList.remove("hidden");
  backBtn.classList.remove("hidden");
  headerTitle.textContent = "ASL | VIETNAMESE";
  unitTitle.textContent = name + " Vocabulary";
  searchInput.value = "";
  renderEntries(name);
}

/* ---------- YOUTUBE HELP ---------- */
function isYouTubeUrl(url){
  if(!url) return false;
  return url.includes("youtube.com") || url.includes("youtu.be");
}

function toYouTubeEmbed(url){
  if(!url) return "";
  let id = "";
  if(url.includes("youtu.be/")){
    const after = url.split("youtu.be/")[1];
    id = after.split(/[?&]/)[0];
  }else if(url.includes("watch?v=")){
    const after = url.split("watch?v=")[1];
    id = after.split(/[?&]/)[0];
  }
  if(!id) return url;
  return "https://www.youtube.com/embed/" + id + "?enablejsapi=1";
}

function setYouTubeSpeed(iframe, rate){
  if(!iframe || !iframe.contentWindow) return;
  iframe.contentWindow.postMessage(JSON.stringify({
    event: "command",
    func: "setPlaybackRate",
    args: [rate]
  }), "*");
}

/* ---------- RENDER ---------- */
function renderEntries(unitName){
  const list = VOCAB[unitName] || [];
  entriesEl.innerHTML = "";
  updateSuggestions(list);

  if(!list.length){
    entriesEl.innerHTML = `<div style="padding:12px;color:#555">
      No vocabulary yet for <b>${escapeHTML(unitName)}</b>.
    </div>`;
    return;
  }

  list.forEach(item=>{
    const { en="", vi="", video="", image="" } = item;

    const card = document.createElement("div");
    card.className = "entry";
    card.dataset.en = en.toLowerCase();
    card.dataset.vi = vi.toLowerCase();

    const top = document.createElement("div");
    top.className = "entry-top";
    top.innerHTML =
      `<span class="en">${escapeHTML(en)}</span>
       <span class="sep">—</span>
       <span class="vi">${escapeHTML(vi)}</span>`;

    const media = document.createElement("div");
    media.className = "media";

    const vbox = document.createElement("div");
    vbox.className = "box";

    const isYT = isYouTubeUrl(video);
    let vid = null;
    let iframe = null;

    if(isYT){
      iframe = document.createElement("iframe");
      iframe.src = toYouTubeEmbed(video);
      iframe.allowFullscreen = true;
      iframe.setAttribute("allow","accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture");
      vbox.appendChild(iframe);
    }else{
      vid = document.createElement("video");
      vid.controls = true;
      if(video) vid.src = video;
      vbox.appendChild(vid);
    }

    const pbox = document.createElement("div");
    pbox.className = "box";
    const img = document.createElement("img");
    img.alt = `Picture for ${en}`;
    img.src = image || PLACEHOLDER_IMG;
    pbox.appendChild(img);

    media.append(vbox, pbox);

    // Speed controls
    const controls = document.createElement("div");
    controls.className = "speed-row";
    const label = document.createElement("span");
    label.className = "speed-label";
    label.textContent = "Speed:";
    controls.appendChild(label);

    const speeds = [0.25, 0.50, 0.75, 1.0];
    speeds.forEach(rate=>{
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "speed-btn";
      btn.textContent =
        rate === 1 ? "1.00x" :
        rate === 0.75 ? "0.75x" :
        rate === 0.5 ? "0.50x" :
        "0.25x";

      if(rate === 1.0) btn.classList.add("active");

      btn.addEventListener("click", ()=>{
        controls.querySelectorAll(".speed-btn")
          .forEach(b=> b.classList.remove("active"));
        btn.classList.add("active");

        if(isYT && iframe){
          setYouTubeSpeed(iframe, rate);
        }else if(vid){
          vid.playbackRate = rate;
        }
      });

      controls.appendChild(btn);
    });

    card.append(top, media, controls);
    entriesEl.appendChild(card);
  });
}

/* ---------- SEARCH ---------- */
function updateSuggestions(list){
  suggestions.innerHTML = "";
  const seen = new Set();
  list.forEach(({en="",vi=""})=>{
    [en,vi].forEach(word=>{
      if(!word) return;
      const value = word.trim();
      const key = value.toLowerCase();
      if(!seen.has(key)){
        const opt = document.createElement("option");
        opt.value = value;
        suggestions.appendChild(opt);
        seen.add(key);
      }
    });
  });
}

searchInput.addEventListener("input", ()=>{
  const q = searchInput.value.trim().toLowerCase();
  filterEntries(q);
});

function filterEntries(q){
  const cards = entriesEl.querySelectorAll(".entry");
  if(!q){ cards.forEach(c=> c.style.display=""); return; }
  cards.forEach(c=>{
    const en = c.dataset.en || "";
    const vi = c.dataset.vi || "";
    c.style.display = (en.includes(q) || vi.includes(q)) ? "" : "none";
  });
}

/* ---------- UTIL ---------- */
function escapeHTML(s){
  return String(s).replace(/[&<>\"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
  }[m]));
}
